<title>Живой двор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: full-screen game canvas; a slim instrument strip on top, zoom at bottom right, speech bubbles in between */
:root {
  --night: #0e0c0d;
  --panel: rgba(18, 15, 13, 0.82);
  --panel-hi: rgba(46, 36, 24, 0.92);
  --paper: #efe4cf;
  --dim: #a99a82;
  --lamp: #f2b45a;
  --line: rgba(242, 180, 90, 0.28);
  --f-ui: "Pixelify Sans", "Courier New", monospace;
  --f-text: "PT Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; font-family: var(--f-text); -webkit-tap-highlight-color: transparent; }
#game { position: fixed; inset: 0; touch-action: none; }
#game canvas { display: block; }

#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 10;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar .grow { flex: 1; }
.chip {
  pointer-events: auto; display: inline-flex; align-items: center; gap: 7px;
  font: 500 15px/1 var(--f-ui); color: var(--paper); background: var(--panel);
  border: 1px solid var(--line); padding: 8px 11px; min-height: 36px; box-sizing: border-box;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
button.chip { cursor: pointer; }
button.chip:hover { background: var(--panel-hi); }
button.chip:focus-visible, #time:focus-visible, .zbtn:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.chip svg { width: 16px; height: 16px; flex: none; }
.chip b { font-weight: 500; }
.chip.on { border-color: rgba(242, 180, 90, 0.6); }
.chip.on svg { color: var(--lamp); }
#clockchip { gap: 9px; }
#clock { font: 700 18px/1 var(--f-ui); color: var(--lamp); font-variant-numeric: tabular-nums; letter-spacing: 0.03em; }
#phase { color: var(--dim); text-transform: lowercase; }
.timerow { pointer-events: auto; display: flex; align-items: center; gap: 10px; max-width: 560px; background: var(--panel); border: 1px solid var(--line); padding: 6px 12px; box-sizing: border-box; }
.timerow span { font: 500 12px/1 var(--f-ui); color: var(--dim); letter-spacing: 0.06em; }
#time { flex: 1; min-width: 0; accent-color: var(--lamp); height: 24px; background: transparent; }

#zoom {
  position: fixed; z-index: 10; display: flex; flex-direction: column; gap: 6px;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.zbtn { width: 42px; height: 42px; font: 700 22px/1 var(--f-ui); color: var(--paper); background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.zbtn:hover { background: var(--panel-hi); }

#hint {
  position: fixed; z-index: 9; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 120px));
  font: 400 15px/1.4 var(--f-text); color: var(--paper); text-align: center;
  background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
#hint b { color: var(--lamp); font-weight: 700; }
#hint.gone { opacity: 0; transform: translate(-50%, 8px); }

#bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
.bubble {
  position: absolute; left: 0; top: 0; max-width: min(260px, 70vw); width: max-content;
  font: 400 15px/1.35 var(--f-text); color: #2a211a; background: #f3ead8;
  padding: 7px 10px 8px; border: 2px solid #2a211a; box-shadow: 3px 3px 0 rgba(0,0,0,0.35);
  opacity: 0; margin-top: -14px; transition: opacity .25s ease, margin-top .25s ease;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 10px; background: #f3ead8; border-right: 2px solid #2a211a; border-bottom: 2px solid #2a211a; transform: translateX(-50%) rotate(45deg); }
.bubble.thought { font-style: italic; background: #e6eef2; color: #1d2a33; border-color: #1d2a33; border-style: dashed; }
.bubble.thought::after { background: #e6eef2; border-color: #1d2a33; width: 8px; height: 8px; bottom: -14px; border-radius: 50%; border: 2px solid #1d2a33; transform: translateX(-50%); }
.bubble.in { opacity: 1; margin-top: -18px; }
.bubble.out { opacity: 0; margin-top: -24px; }

#loader { position: fixed; inset: 0; z-index: 20; background: var(--night); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .7s ease; padding: 0 16px; }
#loader h1 { margin: 0; font: 700 28px/1.1 var(--f-ui); color: var(--lamp); letter-spacing: 0.04em; text-wrap: balance; text-align: center; }
#loader p { margin: 0; color: var(--dim); font: 400 15px/1.4 var(--f-text); text-align: center; }
.track { width: min(260px, 70vw); height: 6px; background: rgba(255,255,255,0.08); }
#loadbar { height: 100%; width: 0; background: var(--lamp); transition: width .2s ease; }
#loader.done { opacity: 0; pointer-events: none; }

@media (max-width: 520px) {
  .chip { font-size: 14px; padding: 7px 9px; min-height: 34px; }
  .chip .lbl { display: none; }
  #clock { font-size: 17px; }
  #hint { font-size: 14px; width: calc(100% - 110px); left: max(16px, env(safe-area-inset-left, 0px)); transform: none; }
  #hint.gone { transform: translateY(8px); }
}
@media (prefers-reduced-motion: reduce) { .bubble, #hint, #loader { transition: none; } }
</style>

<div id="game"></div>
<div id="bubbles"></div>

<div id="hud">
  <div class="bar">
    <div class="chip" id="clockchip" aria-live="off"><span id="clock">17:20</span><span id="phase">вечер</span></div>
    <span class="grow"></span>
    <button class="chip" id="speed" type="button" aria-label="Скорость времени">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 3l6 5-6 5zM8 3l6 5-6 5z"/></svg><b>×1</b>
    </button>
    <button class="chip on" id="rain" type="button" aria-label="Погода">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1.5 8a6.5 5.5 0 0 1 13 0z" fill="currentColor" stroke="none"/><path d="M8 8v5.2a1.6 1.6 0 0 1-3.2 0"/></svg><b class="lbl">дождь</b>
    </button>
    <button class="chip" id="sound" type="button" aria-label="Звук">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path d="M11 5.5c1.2 1.4 1.2 3.6 0 5M12.8 4c2 2.3 2 5.7 0 8" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><b class="lbl">тихо</b>
    </button>
  </div>
  <label class="timerow" for="time"><span>00</span><input id="time" type="range" min="0" max="1439" step="1" value="1040" aria-label="Время суток"><span>24</span></label>
</div>

<div id="zoom"><button class="zbtn" id="zin" type="button" aria-label="Приблизить">+</button><button class="zbtn" id="zout" type="button" aria-label="Отдалить">−</button></div>
<div id="hint">Нажми на землю — <b>Глеб</b> пойдёт. Нажми на людей и вещи — заговорит или осмотрит.</div>

<div id="loader"><h1>Живой двор</h1><p>Включаем фонари…</p><div class="track"><div id="loadbar"></div></div></div>
